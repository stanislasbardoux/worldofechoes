<form class="tome-form" (submit)="$event.preventDefault(); submit()">
  <h2 class="tome-form__title">
    {{ initial ? 'Edit location' : 'New location' }}
  </h2>

  <div class="tome-form__grid">
    <div class="tome-form__full">
      <label for="tome-name">Tome name</label>
      <div class="tome-form__combobox">
        <input
          #tomeInput
          id="tome-name"
          name="tomeName"
          type="text"
          [(ngModel)]="tomeName"
          (ngModelChange)="onTomeNameInput()"
          (focus)="tomeDropdownOpen = true"
          autocomplete="off"
          required
        />
        <button
          type="button"
          class="tome-form__combobox-toggle"
          (click)="toggleTomeDropdown()"
          aria-label="Show all tomes"
          title="Show all tomes"
        >
          ▾
        </button>
        @if (tomeDropdownOpen && filteredTomes().length) {
          <ul class="tome-form__combobox-list" role="listbox">
            @for (t of filteredTomes(); track t.id) {
              <li
                role="option"
                (mousedown)="$event.preventDefault(); selectTome(t)"
              >
                <span
                  [class.rarity-epic]="t.quality === 'epic'"
                  [class.rarity-rare]="t.quality === 'rare'"
                >
                  {{ t.name }}
                </span>
              </li>
            }
          </ul>
        }
      </div>
    </div>

    <div>
      <label for="quality">Quality</label>
      <select
        id="quality"
        name="quality"
        [(ngModel)]="quality"
        (ngModelChange)="onQualityChanged()"
      >
        <option value="epic">Epic (purple)</option>
        <option value="rare">Rare (blue)</option>
      </select>
    </div>

    <div>
      <label for="zone">Zone</label>
      <select id="zone" name="zone" [(ngModel)]="zone">
        @for (z of zones; track z.id) {
          <option [value]="z.id">{{ z.name }}</option>
        }
      </select>
    </div>

    <div class="tome-form__full">
      <label for="description">Description</label>
      <textarea
        id="description"
        name="description"
        rows="4"
        [(ngModel)]="description"
      ></textarea>
    </div>

    <div class="tome-form__full">
      <label>
        Coordinates (drag the pin on the map to adjust)
      </label>
      <div class="tome-form__coords">
        <div>
          <label for="x" class="tome-form__sublabel">X (%)</label>
          <input
            id="x"
            name="x"
            type="number"
            step="0.1"
            min="0"
            max="100"
            [(ngModel)]="xCoord"
            (ngModelChange)="onCoordInput()"
          />
        </div>
        <div>
          <label for="y" class="tome-form__sublabel">Y (%)</label>
          <input
            id="y"
            name="y"
            type="number"
            step="0.1"
            min="0"
            max="100"
            [(ngModel)]="yCoord"
            (ngModelChange)="onCoordInput()"
          />
        </div>
      </div>
    </div>

    <div class="tome-form__full">
      <label for="place">Farm location name</label>
      <input
        id="place"
        name="placeName"
        type="text"
        [(ngModel)]="placeName"
        required
      />
    </div>

    <div class="tome-form__full">
      <label for="mobs">Mobs (one per line)</label>
      <textarea
        id="mobs"
        name="mobs"
        rows="4"
        [(ngModel)]="mobsRaw"
      ></textarea>
    </div>

    <div class="tome-form__full">
      <label>Recommended specs</label>
      <div class="tome-form__specs">
        @for (spec of allSpecs; track spec) {
          <label class="tome-form__spec">
            <input
              type="checkbox"
              [name]="'spec-' + spec"
              [(ngModel)]="specs[spec]"
            />
            <span>{{ specLabels[spec] }}</span>
          </label>
        }
      </div>
    </div>

    <div class="tome-form__full">
      <label for="notes">Notes (optional)</label>
      <textarea id="notes" name="notes" rows="2" [(ngModel)]="notes"></textarea>
    </div>
  </div>

  <div class="tome-form__actions">
    @if (initial) {
      <button
        type="button"
        class="tome-form__danger"
        (click)="onDelete()"
      >
        Delete
      </button>
    }
    <span class="tome-form__actions-spacer"></span>
    <button type="button" (click)="cancelled.emit()">Cancel</button>
    <button type="submit" class="tome-form__primary">
      {{ initial ? 'Save changes' : 'Create' }}
    </button>
  </div>
</form>
